services:
  - type: web
    name: districorp-erp-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && npx tsx server/server.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      # Configure these secrets in Render. They are intentionally never sent to Netlify.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Clienty - Sistema de Ventas
      - key: AUTH_ACCESS_TOKEN_TTL
        value: 15m
      - key: AUTH_REFRESH_TOKEN_DAYS
        value: "30"
      - key: JWT_ISSUER
        value: districorp-erp-api
      - key: JWT_AUDIENCE
        value: districorp-erp-web

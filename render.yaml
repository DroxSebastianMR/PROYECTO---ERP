services:
  - type: web
    name: districorp-erp-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate
    startCommand: npx tsx server/server.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: AUTH_ACCESS_TOKEN_TTL
        value: 15m
      - key: AUTH_REFRESH_TOKEN_DAYS
        value: "30"
      - key: JWT_ISSUER
        value: districorp-erp-api
      - key: JWT_AUDIENCE
        value: districorp-erp-web
